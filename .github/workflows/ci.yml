name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/clover-origin-ros2

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip
          rosdep update --rosdistro jazzy
          rosdep install -y --from-paths src --ignore-src --rosdistro jazzy
          # used by selfcheck, not available in rosdep
          pip install --break-system-packages pymavlink

      - name: Install GeographicLib datasets (mavros_node doesn't start without the geoid)
        run: /opt/ros/jazzy/lib/mavros/install_geographiclib_datasets.sh

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select aruco_pose led_msgs roswww_static clover --cmake-args -DBUILD_TESTING=ON

      - name: Test
        # TEMPORARY: --retest-until-pass 3 hides the flaky tests (see "Flaky tests (CI)" in clover/NOTES.md);
        # remove it when the tests pass without retries (the cause is being found in ci-experiment.yml)
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set -o pipefail
          colcon test --packages-select aruco_pose led_msgs roswww_static clover --event-handlers console_direct+ \
            --retest-until-pass 3 --return-code-on-test-failure 2>&1 | tee test_console.txt

      - name: Tests that were run again
        if: always()
        run: grep -iE "re-?test|re-?run|retry" test_console.txt || echo "no retries found in the output"

      - name: Test results
        if: always()
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test-result --verbose

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log
            test_console.txt
            build/*/test_results
