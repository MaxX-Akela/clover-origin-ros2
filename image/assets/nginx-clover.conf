# Static web server for ~/.ros/www (see `ros2 run roswww_static update`), replaces monkey of the ROS 1 image
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /home/pi/.ros/www;
    index index.html;

    # roswww_static fills the directory with symlinks to share/<package>/www
    disable_symlinks off;

    location / {
        try_files $uri $uri/ =404;
    }
}
